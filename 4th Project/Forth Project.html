
<!DOCTYPE html>
<html lang="en">
<head>
	<title>Marquee Tag(Basic Animation)</title>
</head>
<body>
	
	<marquee scrollamount="50">
		<img src="Dog.Gif" width="800px" height="600px" alt="Dog"/>
		<img src="tom.Gif" width="500px" height="300px" alt="tom"/>
		<img src="jerry.Gif" width="200px" height="200px" alt="tom"/>
	</marquee>
</body>
</html>
