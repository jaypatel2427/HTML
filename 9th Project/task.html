<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="menu-container">
        <!-- Main Title -->
        <h1 class="main-title">
            <span class="title-icon">🍽️</span> FOOD MENU
        </h1>

        <!-- Breakfast Section -->
        <div class="menu-section">
            <h2 class="section-title">🍳 Breakfast</h2>
            <ul class="menu-list">
                <li><i class="ri-sun-line list-icon"></i> Pancakes with Syrup</li>
                <li><i class="ri-sun-line list-icon"></i> Omelette and Toast</li>
                <li><i class="ri-sun-line list-icon"></i> Fruit Salad</li>
            </ul>
        </div>

        <!-- Lunch Section -->
        <div class="menu-section">
            <h2 class="section-title">🍝 Lunch</h2>
            <ul class="menu-list">
                <li><i class="ri-restaurant-line list-icon"></i> Spaghetti Bolognese</li>
                <li><i class="ri-restaurant-line list-icon"></i> Grilled Chicken with Veggies</li>
                <li><i class="ri-restaurant-line list-icon"></i> Veggie Burger</li>
            </ul>
        </div>

        <!-- Dinner Section -->
        <div class="menu-section">
            <h2 class="section-title">🍲 Dinner</h2>
            <ul class="menu-list">
                <li><i class="ri-moon-line list-icon"></i> Butter Paneer with Naan</li>
                <li><i class="ri-moon-line list-icon"></i> Steak with Mashed Potatoes</li>
                <li><i class="ri-moon-line list-icon"></i> Soup and Breadsticks</li>
            </ul>
        </div>
    </div>
</body>
</html>
